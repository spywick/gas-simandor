<aside :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full'" 
             class="fixed inset-y-0 left-0 z-50 w-64 bg-[#1b31a8] text-white flex flex-col min-h-screen shadow-lg transition-transform duration-300 ease-in-out md:translate-x-0 md:static">
        
        <!-- Brand / Header Sidebar -->
        <div class="p-5 border-b border-blue-800/50 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            
            <!-- GANTI INI: Kotak Inisial 'S' -->
            <!-- MENJADI: Elemen Logo Gambar Profesional -->
            <img src="https://lh3.googleusercontent.com/d/1C4qrN0Gqck_xUcdFaLR0-J8RRiDnLAPA" 
                 alt="Logo SIMANDOR" 
                 class="w-50 h-10 object-contain rounded-lg bg-white p-1 shadow-sm flex-shrink-0" />
            
            <!-- Judul Aplikasi -->
            <div class="flex flex-col">
              <span title="Sistem Informasi Monitoring Kinerja dan Honor" 
                    class="text-lg font-bold text-white tracking-wide leading-tight">
                SIMANDOR
              </span>
              <span class="text-[10px] text-blue-200/80 -mt-0.5">
                Monitoring Kinerja & Honor
              </span>
            </div>
            
          </div>
          
          <!-- Tombol Close khusus Mobile (Tetap Sama) -->
          <button @click="toggleSidebar" class="md:hidden text-blue-200 hover:text-white focus:outline-none transition-colors">
            ✕
          </button>
        </div>

        <!-- Navigation Menu -->
        <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
          <!-- Beranda -->
          <button @click="currentMenu = 'beranda'; toggleMobileSidebar()" 
            :class="currentMenu === 'beranda' ? 'bg-blue-700 text-white font-semibold shadow-inner' : 'text-blue-100 hover:bg-blue-800/60 hover:text-white'"
            class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl transition duration-150">
            <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-sm">Beranda</span>
          </button>

          <!-- Menu Kegiatan -->
          <button @click="currentMenu = 'kegiatan'; toggleMobileSidebar()" 
            :class="currentMenu === 'kegiatan' ? 'bg-blue-700 text-white font-semibold shadow-inner' : 'text-blue-100 hover:bg-blue-800/60 hover:text-white'"
            class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl transition duration-150">
            <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012-2m-6 9l2 2 4-4"></path></svg>
            <span class="text-sm">Kegiatan</span>
          </button>

          <!-- Menu Admin (Mencakup User, Tahun, Tim) -->
          <button @click="currentMenu = 'admin'; toggleMobileSidebar()" 
            :class="currentMenu === 'admin' ? 'bg-blue-700 text-white font-semibold shadow-inner' : 'text-blue-100 hover:bg-blue-800/60 hover:text-white'"
            class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl transition duration-150">
            <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="text-sm">Admin</span>
          </button>

        </nav>
      </aside>

      <!-- Backdrop hitam transparan saat sidebar terbuka di mobile -->
      <div v-if="isSidebarOpen" @click="toggleSidebar" class="fixed inset-0 bg-black/50 z-40 md:hidden"></div>
