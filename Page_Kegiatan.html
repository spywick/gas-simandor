<script>
  const PageKegiatan = {
    template: `
      <div class="space-y-6">
        
        <!-- Toast Notifikasi Melayang -->
        <div v-if="toast.show" :class="toast.type === 'success' ? 'bg-green-600' : 'bg-red-600'" class="fixed top-5 right-5 z-50 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-xs transition-all duration-300">
          <span>{{ toast.type === 'success' ? '✅' : '⚠️' }}</span>
          <span class="font-medium">{{ toast.message }}</span>
        </div>

        <!-- PANEL STATISTIK RINGKASAN KEGIATAN (REVISI SENIOR: 2 KARTU DINAMIS) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Card 1: Total Kegiatan (Otomatis Berubah Ikut Filter Tahun/Tim) -->
          <div class="bg-white border border-gray-100 rounded-xl p-4 shadow-sm flex items-center space-x-4">
            <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-lg">
              📋
            </div>
            <div>
              <p class="text-xs text-gray-500 font-medium">Total Seluruh Kegiatan</p>
              <h4 class="text-lg font-bold text-gray-900">{{ filteredList?.length || 0 }} <span class="text-xs font-normal text-gray-500">kegiatan</span></h4>
            </div>
          </div>

          <!-- Card 2: Total Tim Terdaftar / Terlibat -->
          <div class="bg-white border border-gray-100 rounded-xl p-4 shadow-sm flex items-center space-x-4">
            <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-lg">
              👥
            </div>
            <div>
              <p class="text-xs text-gray-500 font-medium">Total Tim Terdaftar</p>
              <h4 class="text-lg font-bold text-gray-900">{{ activeTimCount || 0 }} <span class="text-xs font-normal text-gray-500">tim</span></h4>
            </div>
          </div>
        </div>

        <!-- Kartu Utama Master Kegiatan -->
        <div class="bg-white border border-gray-100 rounded-xl shadow-sm overflow-hidden">
          
          <!-- Header Card & Tombol Aksi -->
          <div class="p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <h3 class="text-sm font-semibold text-gray-900">Master Kegiatan</h3>
              <p class="text-xs text-gray-600 mt-0.5">Kelola Daftar Kegiatan Sensus/Survei BPS Kabupaten Aceh Barat Daya.</p>
            </div>
            
            <div class="flex items-center space-x-2">
              <button @click="fetchData" :disabled="loading" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-xs font-semibold shadow-sm transition flex items-center space-x-1 disabled:opacity-50" title="Muat ulang data">
                <svg :class="{'animate-spin': loading}" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>Refresh</span>
              </button>
              
              <button @click="openModal('create')" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow transition flex items-center space-x-1.5 flex-shrink-0">
                <span>+ Tambah Kegiatan</span>
              </button>
            </div>
          </div>

          <hr class="border-gray-100">

          <!-- Kontrol Atas Tabel (Filter & Pencarian) -->
          <div class="p-4 sm:p-5 bg-gray-50/50 border-b border-gray-100 flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4 text-xs">
            
            <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
              <!-- Per Halaman -->
              <div class="flex items-center space-x-2 text-gray-600">
                <span>Tampilkan</span>
                <select v-model.number="perPage" @change="currentPage = 1" class="border border-gray-300 rounded-lg px-2.5 py-1.5 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium">
                  <option :value="5">5</option>
                  <option :value="10">10</option>
                  <option :value="25">25</option>
                  <option :value="50">50</option>
                </select>
                <span>data</span>
              </div>

              <div class="h-4 w-px bg-gray-300 hidden sm:block"></div>

              <!-- Filter Tahun -->
              <div class="flex items-center space-x-1.5">
                <span class="text-gray-500 font-medium">Tahun:</span>
                <select v-model="filterTahun" @change="onFilterTahunChange" class="border border-gray-300 rounded-lg px-2.5 py-1.5 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium">
                  <option value="">Semua Tahun</option>
                  <option v-for="thn in tahunOptions" :key="thn.ID_TAHUN" :value="thn.ID_TAHUN">
                    {{ thn.TAHUN }}
                  </option>
                </select>
              </div>

              <!-- Filter Tim -->
              <div class="flex items-center space-x-1.5">
                <span class="text-gray-500 font-medium">Tim:</span>
                <select v-model="filterTim" @change="currentPage = 1" class="border border-gray-300 rounded-lg px-2.5 py-1.5 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium">
                  <option value="">Semua Tim</option>
                  <option v-for="tim in filteredTimOptions" :key="tim.ID_TIM" :value="tim.ID_TIM">
                    {{ tim.NAMA_TIM }}
                  </option>
                </select>
              </div>
            </div>

            <!-- Pencarian Teks -->
            <div class="w-full lg:w-64 relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">🔍</span>
              <input v-model="searchQuery" @input="currentPage = 1" type="text" placeholder="Cari nama kegiatan / singkatan..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white" />
            </div>
          </div>

          <div class="px-4 sm:px-6 pt-4 text-xs text-gray-500 font-medium flex justify-between items-center">
            <span>{{ paginationInfo }}</span>
          </div>

          <!-- Tabel Data Kegiatan -->
          <div class="p-4 sm:p-6 pt-2">
            <div class="overflow-x-auto">
              <table class="min-w-full divide-y divide-gray-200 text-xs">
                <thead class="bg-gray-50 text-gray-500 uppercase font-semibold">
                  <tr>
                    <th class="px-4 py-3 text-left">No</th>
                    <th class="px-4 py-3 text-left">Tahun</th>
                    <th class="px-4 py-3 text-left">Tim</th>
                    <th class="px-4 py-3 text-left">Nama Kegiatan</th>
                    <th class="px-4 py-3 text-left">Singkatan</th>
                    <th class="px-4 py-3 text-left">Created At</th>
                    <th class="px-4 py-3 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 bg-white">
                  <tr v-if="loading">
                    <td colspan="7" class="px-4 py-8 text-center text-gray-400">
                      <div class="inline-block w-6 h-6 border-2 border-blue-600 border-t-transparent rounded-full animate-spin mr-2"></div>
                      Memuat data kegiatan...
                    </td>
                  </tr>

                  <tr v-else-if="paginatedList.length === 0">
                    <td colspan="7" class="px-4 py-8 text-center text-gray-400">Tidak ada data Kegiatan yang ditemukan.</td>
                  </tr>

                  <tr v-else v-for="(item, index) in paginatedList" :key="item.ID_KEGIATAN" class="hover:bg-gray-50 transition">
                    <td class="px-4 py-3 text-gray-500 font-medium">{{ startIndex + index + 1 }}</td>
                    <td class="px-4 py-3">
                      <span class="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded font-bold">{{ item.TAHUN_LABEL }}</span>
                    </td>
                    <td class="px-4 py-3 font-semibold text-gray-700">{{ item.TIM_LABEL }}</td>
                    <td class="px-4 py-3 font-bold text-gray-900">{{ item.NAMA_KEGIATAN }}</td>
                    <td class="px-4 py-3 text-gray-600">
                      <span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded font-mono text-[11px]">{{ item.SINGKATAN_KEGIATAN || '-' }}</span>
                    </td>
                    <td class="px-4 py-3 text-gray-500">{{ item.CREATED_AT }}</td>
                    <td class="px-4 py-3 text-center space-x-2">
                      <button @click="openModal('edit', item)" class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-md font-medium transition">Edit</button>
                      <button @click="openDeleteModal(item)" class="text-red-600 hover:text-red-900 bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded-md font-medium transition">Hapus</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Footer Pagination -->
            <div class="mt-4 pt-4 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
              <div class="text-gray-500 font-medium">
                Halaman {{ currentPage }} dari {{ totalPages || 1 }}
              </div>

              <div class="flex items-center space-x-1">
                <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1" class="px-3 py-1.5 border border-gray-300 rounded-lg bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">‹</button>

                <template v-for="page in displayedPages" :key="page">
                  <span v-if="page === '...'" class="px-3 py-1.5 text-gray-400 font-bold">...</span>
                  <button v-else @click="changePage(page)" :class="currentPage === page ? 'bg-blue-600 text-white font-semibold shadow-sm' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'" class="px-3 py-1.5 rounded-lg transition">{{ page }}</button>
                </template>

                <button @click="changePage(currentPage + 1)" :disabled="currentPage === totalPages || totalPages === 0" class="px-3 py-1.5 border border-gray-300 rounded-lg bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">›</button>
              </div>
            </div>

          </div>

        </div>

        <!-- MODAL FORM TAMBAH / EDIT KEGIATAN -->
        <div v-if="showModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
          <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-blue-600 px-5 py-4 flex justify-between items-center text-white">
              <h3 class="font-semibold text-sm">{{ isEditMode ? 'Edit Kegiatan' : 'Tambah Kegiatan Baru' }}</h3>
              <button @click="closeModal" class="text-blue-100 hover:text-white text-lg font-bold">✕</button>
            </div>

            <form @submit.prevent="submitForm" class="p-5 space-y-4 text-xs">
              <div>
                <label class="block font-medium text-gray-700 mb-1">Tahun <span class="text-red-500">*</span></label>
                <select v-model="form.TAHUN_ID" @change="onFormTahunChange" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                  <option value="" disabled>-- Pilih Tahun --</option>
                  <option v-for="thn in tahunOptions" :key="thn.ID_TAHUN" :value="thn.ID_TAHUN">
                    {{ thn.TAHUN }}
                  </option>
                </select>
              </div>

              <div>
                <label class="block font-medium text-gray-700 mb-1">Tim Kerja <span class="text-red-500">*</span></label>
                <select v-model="form.TIM_ID" :disabled="!form.TAHUN_ID" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white disabled:bg-gray-100 disabled:cursor-not-allowed">
                  <option value="" disabled>{{ form.TAHUN_ID ? '-- Pilih Tim --' : '-- Pilih Tahun Terlebih Dahulu --' }}</option>
                  <option v-for="tim in formTimOptions" :key="tim.ID_TIM" :value="tim.ID_TIM">
                    {{ tim.NAMA_TIM }}
                  </option>
                </select>
              </div>

              <div>
                <label class="block font-medium text-gray-700 mb-1">Nama Kegiatan <span class="text-red-500">*</span></label>
                <input v-model="form.NAMA_KEGIATAN" type="text" required placeholder="Contoh: Pembersihan Data Sensus Ekonomi..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
              </div>

              <div>
                <label class="block font-medium text-gray-700 mb-1">Singkatan Kegiatan</label>
                <input v-model="form.SINGKATAN_KEGIATAN" type="text" placeholder="Contoh: SE2026-KAT-G" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
              </div>

              <div class="pt-3 flex justify-end space-x-2 border-t border-gray-100">
                <button type="button" @click="closeModal" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-50 transition">Batal</button>
                <button type="submit" :disabled="saving" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold shadow transition disabled:opacity-50 flex items-center space-x-1">
                  <span v-if="saving" class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin mr-1"></span>
                  <span>{{ saving ? 'Menyimpan...' : 'Simpan' }}</span>
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- MODAL KONFIRMASI HAPUS -->
        <div v-if="showDeleteModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
          <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden p-6 text-center space-y-4">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">⚠️</div>
            <div>
              <h3 class="font-semibold text-sm text-gray-900">Konfirmasi Hapus</h3>
              <p class="text-xs text-gray-600 mt-1">Apakah Anda yakin ingin menghapus kegiatan <span class="font-semibold text-gray-800">"{{ selectedItem ? selectedItem.NAMA_KEGIATAN : '' }}"</span>?</p>
            </div>
            <div class="flex justify-center space-x-2 pt-2">
              <button @click="closeDeleteModal" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-xs font-semibold hover:bg-gray-50 transition">Batal</button>
              <button @click="executeDelete" :disabled="deleting" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold shadow transition disabled:opacity-50">
                {{ deleting ? 'Menghapus...' : 'Ya, Hapus' }}
              </button>
            </div>
          </div>
        </div>

      </div>
    `,
    setup() {
      const { ref, reactive, computed, onMounted } = Vue;

      const kegiatanList = ref([]);
      const tahunOptions = ref([]);
      const timOptions = ref([]);
      const loading = ref(false);
      const saving = ref(false);
      const deleting = ref(false);
      const showModal = ref(false);
      const showDeleteModal = ref(false);
      const isEditMode = ref(false);
      const selectedItem = ref(null);

      const filterTahun = ref('');
      const filterTim = ref('');

      const toast = reactive({
        show: false,
        message: '',
        type: 'success'
      });

      const showToast = (message, type = 'success') => {
        toast.message = message;
        toast.type = type;
        toast.show = true;
        setTimeout(() => { toast.show = false; }, 3000);
      };

      const searchQuery = ref('');
      const perPage = ref(10);
      const currentPage = ref(1);

      const form = reactive({
        ID_KEGIATAN: '',
        TAHUN_ID: '',
        TIM_ID: '',
        NAMA_KEGIATAN: '',
        SINGKATAN_KEGIATAN: ''
      });

      const filteredTimOptions = computed(() => {
        if (!filterTahun.value) return timOptions.value || [];
        return (timOptions.value || []).filter(t => t.TAHUN_ID === filterTahun.value);
      });

      const onFilterTahunChange = () => {
        currentPage.value = 1;
        if (filterTim.value) {
          const exists = filteredTimOptions.value.some(t => t.ID_TIM === filterTim.value);
          if (!exists) filterTim.value = '';
        }
      };

      const formTimOptions = computed(() => {
        if (!form.TAHUN_ID) return [];
        return (timOptions.value || []).filter(t => t.TAHUN_ID === form.TAHUN_ID);
      });

      const onFormTahunChange = () => {
        form.TIM_ID = '';
      };

      const fetchData = () => {
        loading.value = true;
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((data) => {
              kegiatanList.value = data || [];
              loading.value = false;
            })
            .withFailureHandler((err) => {
              showToast('Gagal memuat data kegiatan: ' + err.message, 'error');
              loading.value = false;
            })
            .getKegiatanList();

          google.script.run
            .withSuccessHandler((data) => { tahunOptions.value = data || []; })
            .getTahunList();

          google.script.run
            .withSuccessHandler((data) => { timOptions.value = data || []; })
            .getTimList();
        } else {
          setTimeout(() => { loading.value = false; }, 300);
        }
      };

      const filteredList = computed(() => {
        const rawList = kegiatanList.value || [];
        const list = rawList.filter(item => {
          const matchesTahun = !filterTahun.value || item.TAHUN_ID === filterTahun.value;
          const matchesTim = !filterTim.value || item.TIM_ID === filterTim.value;
          const q = searchQuery.value.toLowerCase();
          const matchesSearch = !q || (
            (item.NAMA_KEGIATAN && item.NAMA_KEGIATAN.toLowerCase().includes(q)) || 
            (item.SINGKATAN_KEGIATAN && item.SINGKATAN_KEGIATAN.toLowerCase().includes(q)) ||
            (item.TIM_LABEL && item.TIM_LABEL.toLowerCase().includes(q)) ||
            (item.TAHUN_LABEL && String(item.TAHUN_LABEL).toLowerCase().includes(q))
          );

          return matchesTahun && matchesTim && matchesSearch;
        });

        // Urutkan Tahun Descending (2027 di atas 2026)
        return list.sort((a, b) => {
          const tahunA = Number(a.TAHUN_LABEL) || 0;
          const tahunB = Number(b.TAHUN_LABEL) || 0;
          if (tahunB !== tahunA) {
            return tahunB - tahunA;
          }
          return new Date(b.CREATED_AT) - new Date(a.CREATED_AT);
        });
      });

      // Hitung jumlah tim unik yang terlibat dari data yang sedang terfilter
      const activeTimCount = computed(() => {
        const list = filteredList.value || [];
        const uniqueTimIds = new Set(list.map(item => item.TIM_ID).filter(Boolean));
        return uniqueTimIds.size;
      });

      const totalPages = computed(() => Math.ceil((filteredList.value?.length || 0) / perPage.value));
      const startIndex = computed(() => (currentPage.value - 1) * perPage.value);
      const paginatedList = computed(() => (filteredList.value || []).slice(startIndex.value, startIndex.value + perPage.value));

      const paginationInfo = computed(() => {
        const total = filteredList.value?.length || 0;
        if (total === 0) return 'Menampilkan 0 data';
        const start = startIndex.value + 1;
        const end = Math.min(startIndex.value + perPage.value, total);
        return `Menampilkan ${start} - ${end} dari ${total} data`;
      });

      const displayedPages = computed(() => {
        const total = totalPages.value;
        const current = currentPage.value;
        if (total <= 5) return Array.from({ length: total }, (_, i) => i + 1);
        if (current <= 3) return [1, 2, 3, 4, '...', total];
        if (current >= total - 2) return [1, '...', total - 3, total - 2, total - 1, total];
        return [1, '...', current - 1, current, current + 1, '...', total];
      });

      const changePage = (page) => {
        if (page >= 1 && page <= totalPages.value) currentPage.value = page;
      };

      const openModal = (mode, item = null) => {
        if (mode === 'edit' && item) {
          isEditMode.value = true;
          Object.assign(form, item);
        } else {
          isEditMode.value = false;
          Object.assign(form, { ID_KEGIATAN: '', TAHUN_ID: '', TIM_ID: '', NAMA_KEGIATAN: '', SINGKATAN_KEGIATAN: '' });
        }
        showModal.value = true;
      };

      const closeModal = () => { showModal.value = false; };

      const submitForm = () => {
        saving.value = true;
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((res) => {
              saving.value = false;
              if (res.success) {
                closeModal();
                fetchData();
                showToast(res.message, 'success');
              } else {
                showToast(res.message, 'error');
              }
            })
            .withFailureHandler((err) => {
              saving.value = false;
              showToast('Gagal menyimpan: ' + err.message, 'error');
            })
            .saveKegiatan(form);
        }
      };

      const openDeleteModal = (item) => {
        selectedItem.value = item;
        showDeleteModal.value = true;
      };

      const closeDeleteModal = () => {
        showDeleteModal.value = false;
        selectedItem.value = null;
      };

      const executeDelete = () => {
        if (!selectedItem.value) return;
        deleting.value = true;

        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((res) => {
              deleting.value = false;
              closeDeleteModal();
              if (res.success) {
                fetchData();
                showToast(res.message, 'success');
              } else {
                showToast(res.message, 'error');
              }
            })
            .withFailureHandler((err) => {
              deleting.value = false;
              closeDeleteModal();
              showToast('Gagal menghapus: ' + err.message, 'error');
            })
            .deleteKegiatan(selectedItem.value.ID_KEGIATAN);
        }
      };

      onMounted(() => { fetchData(); });

      return {
        kegiatanList, tahunOptions, timOptions, loading, saving, deleting, showModal, showDeleteModal, isEditMode, form,
        filterTahun, filterTim, filteredTimOptions, formTimOptions, onFilterTahunChange, onFormTahunChange,
        activeTimCount, searchQuery, perPage, currentPage, totalPages, startIndex, paginatedList, paginationInfo,
        displayedPages, toast, changePage, openModal, closeModal, submitForm,
        openDeleteModal, closeDeleteModal, executeDelete, fetchData, selectedItem, filteredList
      };
    }
  };
</script>
