                <option :value="10">10</option>
                <option :value="25">25</option>
                <option :value="50">50</option>
              </select>
              <span>data per halaman</span>
            </div>

            <!-- Filter Group & Search Bar -->
            <div class="w-full lg:w-auto flex flex-col sm:flex-row items-center gap-2.5">
              <!-- Filter Status -->
              <select v-model="filterStatus" @change="currentPage = 1" class="w-full sm:w-auto px-3 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="">Semua Status</option>
                <option value="Aktif">Aktif</option>
                <option value="Pindah">Pindah</option>
                <option value="Pensiun">Pensiun</option>
                <option value="Meninggal">Meninggal</option>
              </select>

              <!-- Filter Kategori -->
              <select v-model="filterKategori" @change="currentPage = 1" class="w-full sm:w-auto px-3 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="">Semua Kategori</option>
                <option value="PNS">PNS</option>
                <option value="PPPK">PPPK</option>
              </select>

              <!-- Search Input -->
              <div class="w-full sm:w-64 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">🔍</span>
                <input v-model="searchQuery" @input="currentPage = 1" type="text" placeholder="Cari nama, NIP, atau jabatan..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white" />
              </div>
            </div>
          </div>

          <div class="px-4 sm:px-6 pt-4 text-xs text-gray-500 font-medium flex justify-between items-center">
            <span>{{ paginationInfo }}</span>
          </div>

          <!-- Tabel Data Pegawai -->
          <div class="p-4 sm:p-6 pt-2">
            <div class="overflow-x-auto">
              <table class="min-w-full divide-y divide-gray-200 text-xs">
                <thead class="bg-gray-50 text-gray-500 uppercase font-semibold">
                  <tr>
                    <th class="px-4 py-3 text-left">No</th>
                    <th class="px-4 py-3 text-left">Nama / NIP</th>
                    <th class="px-4 py-3 text-left">Jabatan & Gol</th>
                    <th class="px-4 py-3 text-left">Kategori</th>
                    <th class="px-4 py-3 text-left">Kontak & Email</th>
                    <th class="px-4 py-3 text-left">Status</th>
                    <th class="px-4 py-3 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 bg-white">
                  <!-- Loading State -->
                  <tr v-if="loading">
                    <td colspan="7" class="px-4 py-8 text-center text-gray-400">
                      <div class="inline-block w-6 h-6 border-2 border-blue-600 border-t-transparent rounded-full animate-spin mr-2"></div>
                      Memuat data pegawai...
                    </td>
                  </tr>

                  <!-- State Kosong yang Disempurnakan -->
                  <tr v-else-if="paginatedList.length === 0">
                    <td colspan="7" class="px-4 py-12 text-center">
                      <div class="flex flex-col items-center justify-center space-y-2">
                        <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-400">
                          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
                        </div>
                        <p class="font-medium text-gray-700">
                          {{ pegawaiList.length === 0 ? 'Belum ada data pegawai.' : 'Tidak ada data pegawai yang sesuai dengan pencarian atau filter.' }}
                        </p>
                        <p class="text-[11px] text-gray-400">
                          {{ pegawaiList.length === 0 ? 'Silakan tambahkan pegawai baru melalui tombol di atas.' : 'Coba ubah kata kunci pencarian atau reset filter.' }}
                        </p>
                        <button v-if="pegawaiList.length > 0 && (searchQuery || filterStatus || filterKategori)" @click="resetFilter" class="mt-2 px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md font-medium transition">
                          Reset Filter
                        </button>
                      </div>
                    </td>
                  </tr>

                  <!-- Data Row -->
                  <tr v-else v-for="(item, index) in paginatedList" :key="item.ID_PEGAWAI" class="hover:bg-gray-50 transition">
                    <td class="px-4 py-3 text-gray-500 font-medium">{{ startIndex + index + 1 }}</td>
                  
                    <!-- Nama & Avatar & NIP (Bisa diklik untuk view detail) -->
                    <td class="px-4 py-3">
                      <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center text-xs flex-shrink-0">
                          {{ getInitials(item.NAMA_PEGAWAI) }}
                        </div>
                        <div>
                          <a href="#" @click.prevent="openModal('detail', item)" class="font-medium text-blue-600 hover:text-blue-800 hover:underline block" title="Klik untuk lihat detail">
                            {{ item.NAMA_PEGAWAI }}
                          </a>
                          <span class="text-[10px] text-gray-500 block">NIP: {{ item.NIP_BARU || item.NIP_LAMA || '-' }}</span>
                        </div>
                      </div>
                    </td>

                    <!-- Jabatan & Golongan -->
                    <td class="px-4 py-3">
                      <span class="font-medium text-gray-800 block">{{ item.JABATAN || '-' }}</span>
                      <span class="text-[10px] text-gray-500 block">Gol/Ruang: {{ item.GOL_RUANG || '-' }}</span>
                    </td>

                    <!-- Kategori -->
                    <td class="px-4 py-3">
                      <span :class="item.KATEGORI === 'PNS' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'bg-teal-50 text-teal-700 border border-teal-200'" class="px-2.5 py-0.5 text-[10px] font-bold rounded-full">
                        {{ item.KATEGORI || 'PNS' }}
                      </span>
                    </td>

                    <!-- Kontak & Email (Gmail & Satker) -->
                    <td class="px-4 py-3 space-y-0.5">
                      <span class="text-gray-700 block font-medium">📞 {{ item.NO_HP || '-' }}</span>
                      <span class="text-[10px] text-gray-600 block">✉️ Gmail: <span class="text-gray-900">{{ item.EMAIL_GMAIL || '-' }}</span></span>
                      <span class="text-[10px] text-gray-600 block">🏢 Satker: <span class="text-blue-600 font-medium">{{ item.EMAIL_SATKER || '-' }}</span></span>
                    </td>

                    <!-- Status -->
                    <td class="px-4 py-3">
                      <span :class="getStatusBadgeClass(item.STATUS)" class="px-2.5 py-0.5 text-[10px] font-bold rounded-full">
                        {{ item.STATUS || 'Aktif' }}
                      </span>
                    </td>

                    <!-- Aksi -->
                    <td class="px-4 py-3 text-center space-x-1">
                      <button @click="openModal('detail', item)" class="text-emerald-600 hover:text-emerald-900 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1 rounded-md font-medium transition" title="Lihat Detail">Detail</button>
                      <button @click="openModal('edit', item)" class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-md font-medium transition">Edit</button>
                      <button @click="openDeleteModal(item)" class="text-red-600 hover:text-red-900 bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded-md font-medium transition">Hapus</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Footer Pagination -->
            <div class="mt-4 pt-4 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
              <div class="text-gray-500 font-medium">
                Halaman {{ currentPage }} dari {{ totalPages || 1 }}
              </div>

              <div class="flex items-center space-x-1">
                <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1" class="px-3 py-1.5 border border-gray-300 rounded-lg bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">‹</button>

                <template v-for="page in displayedPages" :key="page">
                  <span v-if="page === '...'" class="px-3 py-1.5 text-gray-400 font-bold">...</span>
                  <button v-else @click="changePage(page)" :class="currentPage === page ? 'bg-blue-600 text-white font-semibold shadow-sm' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'" class="px-3 py-1.5 rounded-lg transition">{{ page }}</button>
                </template>

                <button @click="changePage(currentPage + 1)" :disabled="currentPage === totalPages || totalPages === 0" class="px-3 py-1.5 border border-gray-300 rounded-lg bg-white text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">›</button>
              </div>
            </div>

          </div>

        </div>

        <!-- MODAL FORM TAMBAH / EDIT / DETAIL PEGAWAI -->
        <div v-if="showModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm overflow-y-auto">
          <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden my-8 transform transition-all">
            <div :class="modalMode === 'detail' ? 'bg-emerald-600' : 'bg-blue-600'" class="px-5 py-4 flex justify-between items-center text-white transition-colors">
              <h3 class="font-semibold text-sm">
                {{ modalMode === 'detail' ? 'Detail Informasi Pegawai' : (isEditMode ? 'Edit Data Pegawai' : 'Tambah Pegawai Baru') }}
              </h3>
              <button @click="closeModal" class="text-white/80 hover:text-white text-lg font-bold">✕</button>
            </div>

            <form @submit.prevent="submitForm" class="p-5 space-y-4 text-xs">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                <!-- Nama Lengkap -->
                <div class="sm:col-span-2">
                  <label class="block font-medium text-gray-700 mb-1">Nama Lengkap & Gelar <span v-if="modalMode !== 'detail'" class="text-red-500">*</span></label>
                  <input v-model="form.NAMA_PEGAWAI" :disabled="modalMode === 'detail'" type="text" required placeholder="Contoh: Dr. Ahmad Dahlan, M.Si" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-gray-50 disabled:text-gray-700" />
                </div>

                <!-- NIP Baru & NIP Lama -->
                <div>
                  <label class="block font-medium text-gray-700 mb-1">NIP Baru (18 Digit)</label>
                  <input v-model="form.NIP_BARU" :disabled="modalMode === 'detail'" type="text" placeholder="199001012015031001" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-gray-50 disabled:text-gray-700" />
                </div>
                <div>
                  <label class="block font-medium text-gray-700 mb-1">NIP Lama (9 Digit)</label>
                  <input v-model="form.NIP_LAMA" :disabled="modalMode === 'detail'" type="text" placeholder="340012345" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-gray-50 disabled:text-gray-700" />
                </div>

                <!-- Kategori & Gol Ruang -->
                <div>
                  <label class="block font-medium text-gray-700 mb-1">Kategori <span v-if="modalMode !== 'detail'" class="text-red-500">*</span></label>
                  <select v-model="form.KATEGORI" :disabled="modalMode === 'detail'" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white disabled:bg-gray-50 disabled:text-gray-700">
                    <option value="PNS">PNS</option>
                    <option value="PPPK">PPPK</option>
                  </select>
                </div>
                <div>
                  <label class="block font-medium text-gray-700 mb-1">Golongan / Ruang</label>
                  <input v-model="form.GOL_RUANG" :disabled="modalMode === 'detail'" type="text" placeholder="Contoh: III/a, III/c" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-gray-50 disabled:text-gray-700" />
                </div>

                <!-- Jabatan -->
                <div>
                  <label class="block font-medium text-gray-700 mb-1">Jabatan</label>
                  <input v-model="form.JABATAN" :disabled="modalMode === 'detail'" type="text" placeholder="Contoh: Statistisi Ahli Muda" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-gray-50 disabled:text-gray-700" />
                </div>

                <!-- Jenis Kelamin -->
                <div>
                  <label class="block font-medium text-gray-700 mb-1">Jenis Kelamin</label>
                  <select v-model="form.JENIS_KELAMIN" :disabled="modalMode === 'detail'" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white disabled:bg-gray-50 disabled:text-gray-700">
                    <option value="L">Laki-Laki</option>
                    <option value="P">Perempuan</option>
                  </select>
                </div>

                <!-- Tanggal Lahir -->
                <div>
                  <label class="block font-medium text-gray-700 mb-1">Tanggal Lahir</label>
                  <input v-model="form.TANGGAL_LAHIR" :disabled="modalMode === 'detail'" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-gray-50 disabled:text-gray-700" />
                </div>

                <!-- Status Pegawai -->
                <div>
                  <label class="block font-medium text-gray-700 mb-1">Status Kepegawaian <span v-if="modalMode !== 'detail'" class="text-red-500">*</span></label>
                  <select v-model="form.STATUS" :disabled="modalMode === 'detail'" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white disabled:bg-gray-50 disabled:text-gray-700">
                    <option value="Aktif">Aktif</option>
                    <option value="Pindah">Pindah / Mutasi</option>
                    <option value="Pensiun">Pensiun</option>
                    <option value="Meninggal">Meninggal</option>
                  </select>
                </div>

                <!-- No HP & Email Gmail -->
                <div>
                  <label class="block font-medium text-gray-700 mb-1">No. WhatsApp/HP</label>
                  <input v-model="form.NO_HP" :disabled="modalMode === 'detail'" type="text" placeholder="08123456789" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-gray-50 disabled:text-gray-700" />
                </div>
                <div>
                  <label class="block font-medium text-gray-700 mb-1">Email Pribadi (Gmail)</label>
                  <input v-model="form.EMAIL_GMAIL" :disabled="modalMode === 'detail'" type="email" placeholder="nama@gmail.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-gray-50 disabled:text-gray-700" />
                </div>

                <!-- Email Satker -->
                <div class="sm:col-span-2">
                  <label class="block font-medium text-gray-700 mb-1">Email Satker (@bps.go.id)</label>
                  <input v-model="form.EMAIL_SATKER" :disabled="modalMode === 'detail'" type="email" placeholder="nama@bps.go.id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-gray-50 disabled:text-gray-700" />
                </div>

                <!-- Alamat -->
                <div class="sm:col-span-2">
                  <label class="block font-medium text-gray-700 mb-1">Alamat Tempat Tinggal</label>
                  <textarea v-model="form.ALAMAT" :disabled="modalMode === 'detail'" rows="2" placeholder="Alamat lengkap..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-gray-50 disabled:text-gray-700"></textarea>
                </div>
              </div>

              <!-- Tombol Aksi Modal -->
              <div class="pt-3 flex justify-end space-x-2 border-t border-gray-100">
                <button type="button" @click="closeModal" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-50 transition">
                  {{ modalMode === 'detail' ? 'Tutup' : 'Batal' }}
                </button>
                <button v-if="modalMode !== 'detail'" type="submit" :disabled="saving" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold shadow transition disabled:opacity-50 flex items-center space-x-1">
                  <span v-if="saving" class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin mr-1"></span>
                  <span>{{ saving ? 'Menyimpan...' : 'Simpan' }}</span>
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- MODAL KONFIRMASI HAPUS KUSTOM -->
        <div v-if="showDeleteModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
          <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden p-6 text-center space-y-4">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">⚠️</div>
            <div>
              <h3 class="font-semibold text-sm text-gray-900">Konfirmasi Hapus</h3>
              <p class="text-xs text-gray-600 mt-1">Apakah Anda yakin ingin menghapus data pegawai <span class="font-semibold text-gray-800">"{{ selectedItem ? selectedItem.NAMA_PEGAWAI : '' }}"</span>?</p>
            </div>
            <div class="flex justify-center space-x-2 pt-2">
              <button @click="closeDeleteModal" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-xs font-semibold hover:bg-gray-50 transition">Batal</button>
              <button @click="executeDelete" :disabled="deleting" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold shadow transition disabled:opacity-50">
                {{ deleting ? 'Menghapus...' : 'Ya, Hapus' }}
              </button>
            </div>
          </div>
        </div>

      </div>
    `,
    setup() {
      const { ref, reactive, computed, onMounted } = Vue;

      const pegawaiList = ref([]);
      const loading = ref(false);
      const saving = ref(false);
      const deleting = ref(false);
      const showModal = ref(false);
      const showDeleteModal = ref(false);
      const isEditMode = ref(false);
      const modalMode = ref('create'); // 'create', 'edit', atau 'detail'
      const selectedItem = ref(null);

      const toast = reactive({
        show: false,
        message: '',
        type: 'success'
      });

      const showToast = (message, type = 'success') => {
        toast.message = message;
        toast.type = type;
        toast.show = true;
        setTimeout(() => { toast.show = false; }, 3000);
      };

      const searchQuery = ref('');
      const filterStatus = ref('');
      const filterKategori = ref('');
      const perPage = ref(10);
      const currentPage = ref(1);

      const form = reactive({
        ID_PEGAWAI: '',
        NAMA_PEGAWAI: '',
        NIP_LAMA: '',
        NIP_BARU: '',
        GOL_RUANG: '',
        JENIS_KELAMIN: 'L',
        TANGGAL_LAHIR: '',
        ALAMAT: '',
        JABATAN: '',
        NO_HP: '',
        EMAIL_GMAIL: '',
        EMAIL_SATKER: '',
        STATUS: 'Aktif',
        KATEGORI: 'PNS'
      });

      const resetFilter = () => {
        searchQuery.value = '';
        filterStatus.value = '';
        filterKategori.value = '';
        currentPage.value = 1;
      };

      const getInitials = (name) => {
        if (!name) return 'P';
        const parts = name.trim().split(' ');
        if (parts.length >= 2) {
          return (parts[0][0] + parts[1][0]).toUpperCase();
        }
        return name.substring(0, 2).toUpperCase();
      };

      const getStatusBadgeClass = (status) => {
        switch (status) {
          case 'Aktif':
            return 'bg-green-100 text-green-800 border border-green-200';
          case 'Pindah':
            return 'bg-yellow-100 text-yellow-800 border border-yellow-200';
          case 'Pensiun':
            return 'bg-gray-100 text-gray-800 border border-gray-200';
          case 'Meninggal':
            return 'bg-red-100 text-red-800 border border-red-200';
          default:
            return 'bg-blue-100 text-blue-800 border border-blue-200';
        }
      };

      const fetchData = () => {
        loading.value = true;
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((data) => {
              pegawaiList.value = data || [];
              loading.value = false;
            })
            .withFailureHandler((err) => {
              showToast('Gagal memuat data pegawai: ' + err.message, 'error');
              loading.value = false;
            })
            .getPegawaiList();
        } else {
          setTimeout(() => { loading.value = false; }, 300);
        }
      };

      const filteredList = computed(() => {
        return pegawaiList.value.filter(item => {
          const q = searchQuery.value.toLowerCase();
          const matchSearch = !q || 
                              (item.NAMA_PEGAWAI && item.NAMA_PEGAWAI.toLowerCase().includes(q)) || 
                              (item.NIP_BARU && String(item.NIP_BARU).includes(q)) ||
                              (item.NIP_LAMA && String(item.NIP_LAMA).includes(q)) ||
                              (item.JABATAN && item.JABATAN.toLowerCase().includes(q));

          const matchStatus = filterStatus.value === '' || item.STATUS === filterStatus.value;
          const matchKategori = filterKategori.value === '' || item.KATEGORI === filterKategori.value;

          return matchSearch && matchStatus && matchKategori;
        });
      });

      const totalPages = computed(() => Math.ceil(filteredList.value.length / perPage.value));
      const startIndex = computed(() => (currentPage.value - 1) * perPage.value);
      const paginatedList = computed(() => filteredList.value.slice(startIndex.value, startIndex.value + perPage.value));

      const paginationInfo = computed(() => {
        const total = filteredList.value.length;
        if (total === 0) return 'Menampilkan 0 data';
        const start = startIndex.value + 1;
        const end = Math.min(startIndex.value + perPage.value, total);
        return `Menampilkan ${start} - ${end} dari ${total} data`;
      });

      const displayedPages = computed(() => {
        const total = totalPages.value;
        const current = currentPage.value;
        if (total <= 5) return Array.from({ length: total }, (_, i) => i + 1);
        if (current <= 3) return [1, 2, 3, 4, '...', total];
        if (current >= total - 2) return [1, '...', total - 3, total - 2, total - 1, total];
        return [1, '...', current - 1, current, current + 1, '...', total];
      });

      const changePage = (page) => {
        if (page >= 1 && page <= totalPages.value) currentPage.value = page;
      };

      const openModal = (mode, item = null) => {
        modalMode.value = mode; // 'create', 'edit', atau 'detail'
        if (mode === 'edit' || mode === 'detail') {
          isEditMode.value = (mode === 'edit');
          if (item) Object.assign(form, item);
        } else {
          isEditMode.value = false;
          Object.assign(form, {
            ID_PEGAWAI: '',
            NAMA_PEGAWAI: '',
            NIP_LAMA: '',
            NIP_BARU: '',
            GOL_RUANG: '',
            JENIS_KELAMIN: 'L',
            TANGGAL_LAHIR: '',
            ALAMAT: '',
            JABATAN: '',
            NO_HP: '',
            EMAIL_GMAIL: '',
            EMAIL_SATKER: '',
            STATUS: 'Aktif',
            KATEGORI: 'PNS'
          });
        }
        showModal.value = true;
      };

      const closeModal = () => { showModal.value = false; };

      const submitForm = () => {
        if (modalMode.value === 'detail') return;

        saving.value = true;
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((res) => {
              saving.value = false;
              if (res.success) {
                closeModal();
                fetchData();
                showToast(res.message, 'success');
              } else {
                showToast(res.message, 'error');
              }
            })
            .withFailureHandler((err) => {
              saving.value = false;
              showToast('Gagal menyimpan: ' + err.message, 'error');
            })
            .savePegawai(form);
        }
      };

      const openDeleteModal = (item) => {
        selectedItem.value = item;
        showDeleteModal.value = true;
      };

      const closeDeleteModal = () => {
        showDeleteModal.value = false;
        selectedItem.value = null;
      };

      const executeDelete = () => {
        if (!selectedItem.value) return;
        deleting.value = true;

        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((res) => {
              deleting.value = false;
              closeDeleteModal();
              if (res.success) {
                fetchData();
                showToast(res.message, 'success');
              } else {
                showToast(res.message, 'error');
              }
            })
            .withFailureHandler((err) => {
              deleting.value = false;
              closeDeleteModal();
              showToast('Gagal menghapus: ' + err.message, 'error');
            })
            .deletePegawai(selectedItem.value.ID_PEGAWAI);
        }
      };

      onMounted(() => { fetchData(); });

      return {
        pegawaiList, loading, saving, deleting, showModal, showDeleteModal, isEditMode, modalMode, form,
        searchQuery, filterStatus, filterKategori, perPage, currentPage, totalPages, startIndex, paginatedList, paginationInfo,
        displayedPages, toast, getInitials, getStatusBadgeClass, resetFilter, changePage, openModal, closeModal, submitForm,
        openDeleteModal, closeDeleteModal, executeDelete, fetchData, selectedItem
      };
    }
  };
</script>
