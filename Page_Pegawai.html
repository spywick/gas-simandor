                      <span>Kontak & Akun Email</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-gray-50/80 border border-gray-100 rounded-xl p-4">
                      <div>
                        <div class="text-[11px] text-gray-400">No. WhatsApp / HP</div>
                        <div class="font-semibold text-gray-800 mt-0.5">{{ form.NO_HP || '-' }}</div>
                      </div>
                      <div>
                        <div class="text-[11px] text-gray-400">Email Pribadi (Gmail)</div>
                        <div class="font-semibold text-gray-800 mt-0.5 break-all">{{ form.EMAIL_GMAIL || '-' }}</div>
                      </div>
                      <div>
                        <div class="text-[11px] text-gray-400">Email Satker</div>
                        <div class="font-semibold text-blue-600 mt-0.5 break-all">{{ form.EMAIL_SATKER || '-' }}</div>
                      </div>
                    </div>
                  </div>

                </div>

                <!-- Footer Modal Detail -->
                <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex items-center justify-between gap-2 text-xs">
                  <button
                    type="button"
                    @click="switchDetailToEdit"
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold shadow-xs transition inline-flex items-center gap-1.5 cursor-pointer"
                  >
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                    <span>Edit Pegawai</span>
                  </button>

                  <button
                    type="button"
                    @click="closeModal"
                    class="px-4 py-2 border border-gray-300 bg-white hover:bg-gray-50 text-gray-700 rounded-lg font-semibold transition cursor-pointer"
                  >
                    Tutup
                  </button>
                </div>

              </div>
            </transition>
          </div>
        </transition>

        <!-- MODAL FORM TAMBAH / EDIT PEGAWAI -->
        <transition
          enter-active-class="ease-out duration-200"
          enter-from-class="opacity-0"
          enter-to-class="opacity-100"
          leave-active-class="ease-in duration-150"
          leave-from-class="opacity-100"
          leave-to-class="opacity-0"
        >
          <div v-if="showModal && modalMode !== 'detail'" @click.self="closeModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/55 backdrop-blur-xs overflow-y-auto">
            <transition
              appear
              enter-active-class="ease-out duration-200"
              enter-from-class="opacity-0 scale-95 translate-y-2"
              enter-to-class="opacity-100 scale-100 translate-y-0"
              leave-active-class="ease-in duration-150"
              leave-from-class="opacity-100 scale-100 translate-y-0"
              leave-to-class="opacity-0 scale-95 translate-y-2"
            >
              <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden my-8">
                <div class="bg-blue-600 px-5 py-4 flex justify-between items-center text-white">
                  <h3 class="font-semibold text-sm">
                    {{ isEditMode ? 'Edit Data Pegawai' : 'Tambah Pegawai Baru' }}
                  </h3>
                  <button @click="closeModal" class="text-white/80 hover:text-white text-lg font-bold cursor-pointer">✕</button>
                </div>

                <form @submit.prevent="submitForm" class="p-5 space-y-4 text-xs">
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    
                    <!-- Nama Lengkap -->
                    <div class="sm:col-span-2">
                      <label class="block font-medium text-gray-700 mb-1">Nama Lengkap & Gelar <span class="text-red-500">*</span></label>
                      <input v-model="form.NAMA_PEGAWAI" type="text" required placeholder="Contoh: Dr. Ahmad Dahlan, M.Si" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    </div>

                    <!-- NIP Baru & NIP Lama -->
                    <div>
                      <label class="block font-medium text-gray-700 mb-1">NIP Baru (18 Digit)</label>
                      <input v-model="form.NIP_BARU" type="text" placeholder="199001012015031001" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    </div>
                    <div>
                      <label class="block font-medium text-gray-700 mb-1">NIP Lama (9 Digit)</label>
                      <input v-model="form.NIP_LAMA" type="text" placeholder="340012345" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    </div>

                    <!-- Kategori & Gol Ruang -->
                    <div>
                      <label class="block font-medium text-gray-700 mb-1">Kategori <span class="text-red-500">*</span></label>
                      <select v-model="form.KATEGORI" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="PNS">PNS</option>
                        <option value="PPPK">PPPK</option>
                      </select>
                    </div>
                    <div>
                      <label class="block font-medium text-gray-700 mb-1">Golongan / Ruang</label>
                      <input v-model="form.GOL_RUANG" type="text" placeholder="Contoh: III/a, III/c" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    </div>

                    <!-- Jabatan -->
                    <div>
                      <label class="block font-medium text-gray-700 mb-1">Jabatan</label>
                      <input v-model="form.JABATAN" type="text" placeholder="Contoh: Statistisi Ahli Muda" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    </div>

                    <!-- Jenis Kelamin -->
                    <div>
                      <label class="block font-medium text-gray-700 mb-1">Jenis Kelamin</label>
                      <select v-model="form.JENIS_KELAMIN" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="L">Laki-Laki</option>
                        <option value="P">Perempuan</option>
                      </select>
                    </div>

                    <!-- Tanggal Lahir -->
                    <div>
                      <label class="block font-medium text-gray-700 mb-1">Tanggal Lahir</label>
                      <input v-model="form.TANGGAL_LAHIR" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    </div>

                    <!-- Status Pegawai -->
                    <div>
                      <label class="block font-medium text-gray-700 mb-1">Status Kepegawaian <span class="text-red-500">*</span></label>
                      <select v-model="form.STATUS" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="Aktif">Aktif</option>
                        <option value="Pindah">Pindah / Mutasi</option>
                        <option value="Pensiun">Pensiun</option>
                        <option value="Meninggal">Meninggal</option>
                      </select>
                    </div>

                    <!-- No HP & Email Gmail -->
                    <div>
                      <label class="block font-medium text-gray-700 mb-1">No. WhatsApp/HP</label>
                      <input v-model="form.NO_HP" type="text" placeholder="08123456789" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    </div>
                    <div>
                      <label class="block font-medium text-gray-700 mb-1">Email Pribadi (Gmail)</label>
                      <input v-model="form.EMAIL_GMAIL" type="email" placeholder="nama@gmail.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    </div>

                    <!-- Email Satker -->
                    <div class="sm:col-span-2">
                      <label class="block font-medium text-gray-700 mb-1">Email Satker (@bps.go.id)</label>
                      <input v-model="form.EMAIL_SATKER" type="email" placeholder="nama@bps.go.id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    </div>

                    <!-- Alamat -->
                    <div class="sm:col-span-2">
                      <label class="block font-medium text-gray-700 mb-1">Alamat Tempat Tinggal</label>
                      <textarea v-model="form.ALAMAT" rows="2" placeholder="Alamat lengkap..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                    </div>
                  </div>

                  <!-- Tombol Aksi Modal -->
                  <div class="pt-3 flex justify-end space-x-2 border-t border-gray-100">
                    <button type="button" @click="closeModal" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-50 transition cursor-pointer">
                      Batal
                    </button>
                    <button type="submit" :disabled="saving" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold shadow transition disabled:opacity-50 flex items-center space-x-1 cursor-pointer">
                      <span v-if="saving" class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin mr-1"></span>
                      <span>{{ saving ? 'Menyimpan...' : 'Simpan' }}</span>
                    </button>
                  </div>
                </form>
              </div>
            </transition>
          </div>
        </transition>

        <!-- MODAL KONFIRMASI HAPUS KUSTOM -->
        <transition
          enter-active-class="ease-out duration-200"
          enter-from-class="opacity-0"
          enter-to-class="opacity-100"
          leave-active-class="ease-in duration-150"
          leave-from-class="opacity-100"
          leave-to-class="opacity-0"
        >
          <div v-if="showDeleteModal" @click.self="closeDeleteModal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/55 backdrop-blur-xs">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden p-6 text-center space-y-4">
              <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">⚠️</div>
              <div>
                <h3 class="font-semibold text-sm text-gray-900">Konfirmasi Hapus</h3>
                <p class="text-xs text-gray-600 mt-1">Apakah Anda yakin ingin menghapus data pegawai <span class="font-semibold text-gray-800">"{{ selectedItem ? selectedItem.NAMA_PEGAWAI : '' }}"</span>?</p>
              </div>
              <div class="flex justify-center space-x-2 pt-2">
                <button @click="closeDeleteModal" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-xs font-semibold hover:bg-gray-50 transition cursor-pointer">Batal</button>
                <button @click="executeDelete" :disabled="deleting" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold shadow transition disabled:opacity-50 cursor-pointer">
                  {{ deleting ? 'Menghapus...' : 'Ya, Hapus' }}
                </button>
              </div>
            </div>
          </div>
        </transition>

      </div>
    `,
    setup() {
      const { ref, reactive, computed, onMounted } = Vue;

      const pegawaiList = ref([]);
      const loading = ref(false);
      const saving = ref(false);
      const deleting = ref(false);
      const showModal = ref(false);
      const showDeleteModal = ref(false);
      const isEditMode = ref(false);
      const modalMode = ref('create'); // 'create', 'edit', atau 'detail'
      const selectedItem = ref(null);

      const toast = reactive({
        show: false,
        message: '',
        type: 'success'
      });

      const showToast = (message, type = 'success') => {
        toast.message = message;
        toast.type = type;
        toast.show = true;
        setTimeout(() => { toast.show = false; }, 3000);
      };

      const searchQuery = ref('');
      const filterStatus = ref('');
      const filterKategori = ref('');
      const perPage = ref(10);
      const currentPage = ref(1);

      const stats = computed(() => {
        const list = pegawaiList.value || [];
        let aktif = 0;
        let lakiLaki = 0;
        let perempuan = 0;

        list.forEach(item => {
          const status = String(item.STATUS || 'Aktif').trim().toLowerCase();
          if (status === 'aktif') aktif++;

          const jk = String(item.JENIS_KELAMIN || '').trim().toLowerCase();
          if (jk === 'l' || jk === 'laki-laki' || jk === 'laki') lakiLaki++;
          else if (jk === 'p' || jk === 'perempuan' || jk === 'wanita') perempuan++;
        });

        return {
          total: list.length,
          aktif,
          lakiLaki,
          perempuan
        };
      });

      const toggleStatusFilter = (status) => {
        filterStatus.value = filterStatus.value === status ? '' : status;
        currentPage.value = 1;
      };

      const form = reactive({
        ID_PEGAWAI: '',
        NAMA_PEGAWAI: '',
        NIP_LAMA: '',
        NIP_BARU: '',
        GOL_RUANG: '',
        JENIS_KELAMIN: 'L',
        TANGGAL_LAHIR: '',
        ALAMAT: '',
        JABATAN: '',
        NO_HP: '',
        EMAIL_GMAIL: '',
        EMAIL_SATKER: '',
        STATUS: 'Aktif',
        KATEGORI: 'PNS'
      });

      const resetFilter = () => {
        searchQuery.value = '';
        filterStatus.value = '';
        filterKategori.value = '';
        currentPage.value = 1;
      };

      const getInitials = (name) => {
        if (!name) return 'P';
        const parts = name.trim().split(' ');
        if (parts.length >= 2) {
          return (parts[0][0] + parts[1][0]).toUpperCase();
        }
        return name.substring(0, 2).toUpperCase();
      };

      const formatTanggalIndo = (val) => {
        if (!val) return '-';
        const d = new Date(val);
        if (Number.isNaN(d.getTime())) return String(val);
        return d.toLocaleDateString('id-ID', {
          day: '2-digit',
          month: 'long',
          year: 'numeric'
        });
      };

      const getStatusBadgeClass = (status) => {
        switch (status) {
          case 'Aktif':
            return 'bg-green-100 text-green-800 border border-green-200';
          case 'Pindah':
            return 'bg-yellow-100 text-yellow-800 border border-yellow-200';
          case 'Pensiun':
            return 'bg-gray-100 text-gray-800 border border-gray-200';
          case 'Meninggal':
            return 'bg-red-100 text-red-800 border border-red-200';
          default:
            return 'bg-blue-100 text-blue-800 border border-blue-200';
        }
      };

      const fetchData = () => {
        loading.value = true;
        if (typeof google !== 'undefined' && google.script) {
          appRun
            .withSuccessHandler((data) => {
              pegawaiList.value = data || [];
              loading.value = false;
            })
            .withFailureHandler((err) => {
              showToast('Gagal memuat data pegawai: ' + err.message, 'error');
              loading.value = false;
            })
            .getPegawaiList();
        } else {
          setTimeout(() => { loading.value = false; }, 300);
        }
      };

      const filteredList = computed(() => {
        return pegawaiList.value.filter(item => {
          const q = searchQuery.value.toLowerCase();
          const matchSearch = !q || 
                              (item.NAMA_PEGAWAI && item.NAMA_PEGAWAI.toLowerCase().includes(q)) || 
                              (item.NIP_BARU && String(item.NIP_BARU).includes(q)) ||
                              (item.NIP_LAMA && String(item.NIP_LAMA).includes(q)) ||
                              (item.JABATAN && item.JABATAN.toLowerCase().includes(q));

          const matchStatus = filterStatus.value === '' || item.STATUS === filterStatus.value;
          const matchKategori = filterKategori.value === '' || item.KATEGORI === filterKategori.value;

          return matchSearch && matchStatus && matchKategori;
        });
      });

      const totalPages = computed(() => Math.ceil(filteredList.value.length / perPage.value));
      const startIndex = computed(() => (currentPage.value - 1) * perPage.value);
      const paginatedList = computed(() => filteredList.value.slice(startIndex.value, startIndex.value + perPage.value));

      const paginationInfo = computed(() => {
        const total = filteredList.value.length;
        if (total === 0) return 'Menampilkan 0 data';
        const start = startIndex.value + 1;
        const end = Math.min(startIndex.value + perPage.value, total);
        return `Menampilkan ${start} - ${end} dari ${total} data`;
      });

      const displayedPages = computed(() => {
        const total = totalPages.value;
        const current = currentPage.value;
        if (total <= 5) return Array.from({ length: total }, (_, i) => i + 1);
        if (current <= 3) return [1, 2, 3, 4, '...', total];
        if (current >= total - 2) return [1, '...', total - 3, total - 2, total - 1, total];
        return [1, '...', current - 1, current, current + 1, '...', total];
      });

      const changePage = (page) => {
        if (page >= 1 && page <= totalPages.value) currentPage.value = page;
      };

      const openModal = (mode, item = null) => {
        modalMode.value = mode; // 'create', 'edit', atau 'detail'
        if (mode === 'edit' || mode === 'detail') {
          isEditMode.value = (mode === 'edit');
          if (item) Object.assign(form, item);
        } else {
          isEditMode.value = false;
          Object.assign(form, {
            ID_PEGAWAI: '',
            NAMA_PEGAWAI: '',
            NIP_LAMA: '',
            NIP_BARU: '',
            GOL_RUANG: '',
            JENIS_KELAMIN: 'L',
            TANGGAL_LAHIR: '',
            ALAMAT: '',
            JABATAN: '',
            NO_HP: '',
            EMAIL_GMAIL: '',
            EMAIL_SATKER: '',
            STATUS: 'Aktif',
            KATEGORI: 'PNS'
          });
        }
        showModal.value = true;
      };

      const switchDetailToEdit = () => {
        modalMode.value = 'edit';
        isEditMode.value = true;
      };

      const closeModal = () => { showModal.value = false; };

      const submitForm = () => {
        if (modalMode.value === 'detail') return;

        saving.value = true;
        if (typeof google !== 'undefined' && google.script) {
          appRun
            .withSuccessHandler((res) => {
              saving.value = false;
              if (res.success) {
                closeModal();
                fetchData();
                showToast(res.message, 'success');
              } else {
                showToast(res.message, 'error');
              }
            })
            .withFailureHandler((err) => {
              saving.value = false;
              showToast('Gagal menyimpan: ' + err.message, 'error');
            })
            .savePegawai(form);
        }
      };

      const openDeleteModal = (item) => {
        selectedItem.value = item;
        showDeleteModal.value = true;
      };

      const closeDeleteModal = () => {
        showDeleteModal.value = false;
        selectedItem.value = null;
      };

      const executeDelete = () => {
        if (!selectedItem.value) return;
        deleting.value = true;

        if (typeof google !== 'undefined' && google.script) {
          appRun
            .withSuccessHandler((res) => {
              deleting.value = false;
              closeDeleteModal();
              if (res.success) {
                fetchData();
                showToast(res.message, 'success');
              } else {
                showToast(res.message, 'error');
              }
            })
            .withFailureHandler((err) => {
              deleting.value = false;
              closeDeleteModal();
              showToast('Gagal menghapus: ' + err.message, 'error');
            })
            .deletePegawai(selectedItem.value.ID_PEGAWAI);
        }
      };

      onMounted(() => { fetchData(); });

      return {
        pegawaiList, loading, saving, deleting, showModal, showDeleteModal, isEditMode, modalMode, form,
        searchQuery, filterStatus, filterKategori, perPage, currentPage, totalPages, startIndex, paginatedList, paginationInfo,
        displayedPages, toast, stats, toggleStatusFilter, getInitials, formatTanggalIndo, getStatusBadgeClass, resetFilter,
        changePage, openModal, switchDetailToEdit, closeModal, submitForm, openDeleteModal, closeDeleteModal, executeDelete,
        fetchData, selectedItem
      };
    }
  };
</script>
